<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Make My Dish: easy Mumbai street-food recipes made at home.">
    <title>Make My Dish | Mumbai Street Food Recipes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Make My Dish</a>
        <span class="brand-tagline">Good food brings people together</span>
    </header>

    <main>
        <section class="recipe-finder">
            <p class="eyebrow">Mumbai street food recipes</p>
            <h1>What are you <em>craving?</em></h1>
            <p>Search a recipe or choose a dish to start cooking.</p>
            <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input id="recipe-search" type="search" placeholder="Search recipes, ingredients..." autocomplete="off">
            </label>
            <div id="recipe-cards" class="recipe-cards" aria-live="polite"></div>
        </section>

        <section id="recipe-detail" aria-live="polite"></section>
    </main>

    <footer><p>Make My Dish <span>·</span> Mumbai-style comfort, made at home.</p></footer>
    <script src="script.js"></script>
</body>
</html>
